// =============================================

// ========== PLANETS ==========
planet.alef-null-arithmetic.name = Arithmetic
planet.alef-null-arithmetic.description = A branch of mathematics that studies the simplest operations with numbers.

// ========== SECTORS ==========
sector.alef-null-subitization.name = Subitization
sector.alef-null-subitization.description = The first sector of the first set of numbers in the first branch of mathematics. Learn the basics of arithmetic and repel waves of negative operations.

sector.alef-null-function-bridge.name = Function Bridge
sector.alef-null-function-bridge.description = A sector shaped like addition and subtraction functions. Repel enhanced enemy waves, research upgraded turrets, and unlock unit production technology for defense.

// ========== CORES ==========
block.alef-null-core-n.name = Core: «Axiom»
block.alef-null-core-n.description = First iteration of the core. N denotes belonging to natural numbers.

// ========== ITEMS ==========
// == NUMBERS ==
item.alef-null-one.name = One
item.alef-null-one.description = One – the basis of natural numbers.
item.alef-null-one.details = Positive natural number, multiplicative identity, additive foundation of the number field located on the number line. It is the smallest positive element in the set of natural numbers. Algebraically closed under itself. Also the number of my neurons when creating this text.

item.alef-null-anti-one.name = Negative one
item.alef-null-anti-one.description = Negative one – the antipode of one and the basis of negative numbers.
item.alef-null-anti-one.details = The number of my IQ when creating the mod.

item.alef-null-zero.name = Zero
item.alef-null-zero.description = Emptiness – the basis of all sets.
item.alef-null-zero.details = Zero is neither positive nor negative, part of the foundation of all mathematics, additive identity, and what was in my head when creating the mod.

item.alef-null-i.name = Imaginary unit
item.alef-null-i.description = Imaginary unit – the basis of complex numbers.
item.alef-null-i.details = Square root of negative one, 90-degree rotation, gateway to the complex plane.

item.alef-null-fraction.name = Fraction
item.alef-null-fraction.description = 1/x – the basis of rational numbers.
item.alef-null-fraction.details = Not from a shotgun!(but that's not certain)

// == CONSTANTS ==
item.alef-null-pi.name = Pi
item.alef-null-pi.description = π - the foundation of trigonometry.
item.alef-null-pi.details = Half a circle in radians, 180-degree rotation.

item.alef-null-e.name = Euler's number
item.alef-null-e.description = e - a constant that appears in many places.
item.alef-null-e.details = Compound interest, sum of reciprocal factorials, and an Alan Becker reference.

// == OPERATIONS ==
item.alef-null-plus.name = Plus
item.alef-null-plus.description = Symbol of addition. Repeated succession. First-order operation.
item.alef-null-plus.details = Commutative. Associative. Distributive over multiplication. But succession is better.

item.alef-null-minus.name = Minus
item.alef-null-minus.description = Symbol of subtraction. Inverse operation of addition. First-order operation.

liquid.alef-null-inversion.name = Inversion
liquid.alef-null-inversion.description = Basic concept of an inverse operation. Used to invert units.

item.alef-null-multiplication.name = Multiplication
item.alef-null-multiplication.description = Repeated addition. Second-order operation.

item.alef-null-division.name = Division
item.alef-null-division.description = Inverse operation of multiplication — splitting a whole into parts. Second-order operation.
item.alef-null-division.details = Quite the individuum!

item.alef-null-power.name = Power
item.alef-null-power.description = ^ — repeated multiplication. Third-order operation.

item.alef-null-root.name = Root
item.alef-null-root.description = √ — inverse of exponentiation. Finds the base. Third-order operation.
item.alef-null-root.details = Viktor Rootcrop and Rooty Rooterson in one person.

item.alef-null-logarithm.name = Logarithm
item.alef-null-logarithm.description = log — inverse of exponentiation. Finds the exponent. Third-order operation.

item.alef-null-factorial.name = Factorial
item.alef-null-factorial.description = ! — product of all numbers from 1 to n.

// == OTHER ==
item.alef-null-variable.name = Variable
item.alef-null-variable.description = Variable – the basis of algebra, represents an unknown number.
item.alef-null-variable.details = Free argument.

item.alef-null-approaches-infinity.name = Approaches infinity
item.alef-null-approaches-infinity.description = ∞ — symbol of infinity.
item.alef-null-approaches-infinity.details = Infinity didn't fart!

item.alef-null-lim.name = Limit
item.alef-null-lim.description = lim — limit of a function or sequence.
item.alef-null-lim.details = Where did you fart?

item.alef-null-sum.name = Sum of a series
item.alef-null-sum.description = Σ — sum of a sequence.

item.alef-null-derivative.name = Derivative
item.alef-null-derivative.description = d/dx — rate of change of a function.

item.alef-null-integral.name = Integral
item.alef-null-integral.description = ∫ — area under a curve.

item.alef-null-function.name = Function
item.alef-null-function.description = An algorithm for the dependence of y on x. Can be represented as a table or graph.

// ========== DRILLS ==========
block.alef-null-successor.name = Successor
block.alef-null-successor.description = Performs succession on the surface it is placed on.
block.alef-null-successor.details = S(n) = n+1

// ========== PRODUCTION ==========
block.alef-null-pluser.name = Pluser
block.alef-null-pluser.description = Turns plus into one.

block.alef-null-minuser.name = Minuser
block.alef-null-minuser.description = Turns minus into negative one.

block.alef-null-equalizer.name = Equalizer
block.alef-null-equalizer.description = Equalizes 1 and -1 into 0.

block.alef-null-absolute-value.name = Absolute value
block.alef-null-absolute-value.description = Converts any number into a positive one.

block.alef-null-mono-constructor.name = Mono-constructor
block.alef-null-mono-constructor.description = Produces the basic unit - the Additor.

block.alef-null-anti-constructor.name = Anti-constructor
block.alef-null-anti-constructor.description = Inverts auxiliary units into combat ones.

// ========== TURRETS ==========
block.alef-null-exponential-progressor.name = Exponential progressor
block.alef-null-exponential-progressor.description = Basic turret based on powers of two. Each shot is 2 times stronger than the previous one.

block.alef-null-additive-turret.name = Additive turret
block.alef-null-additive-turret.description = Fires twos at enemies.
block.alef-null-additive-turret.details = 1 + 1 = 2, but for balance it will deal 20 damage.

block.alef-null-double-additive-turret.name = Double additive turret
block.alef-null-double-additive-turret.description = Fires fours at enemies.
block.alef-null-double-additive-turret.details = 2 + 2 = 4, but for balance it will deal 40 damage.\nAlan Becker

// ========== LOGISTICS ==========
block.alef-null-mono-conveyor.name = Mono-conveyor
block.alef-null-mono-conveyor.description = Basic conveyor based on the commutativity of addition.

block.alef-null-deka-conveyor.name = Deca-conveyor
block.alef-null-deka-conveyor.description = Splits and then multiplies items by 10 for compact transportation. Still based on the commutativity of addition.

block.alef-null-imaginary-bridge.name = Imaginary bridge
block.alef-null-imaginary-bridge.description = Transports items by multiplying by i.

block.alef-null-intersection.name = Intersection
block.alef-null-intersection.description = Allows two intersecting conveyors to work independently without mixing items.

block.alef-null-equals.name = Equals
block.alef-null-equals.description = Equalizes item counts between neighboring blocks.

block.alef-null-division-router.name = Division
block.alef-null-division-router.description = Divides one input stream into three output streams.
block.alef-null-division-router.details = unfortunately division isn't made from division, because I couldn't deprive you of the router - I'm not a monster

// ========== POWER ==========
block.alef-null-generator-decay.name = Decay generator
block.alef-null-generator-decay.description = Splits ones into energy and zero.

block.alef-null-math-node.name = Graph vertex
block.alef-null-math-node.description = Transfers energy between blocks.

// ========== WALLS ==========
block.alef-null-limit-shield.name = Limit shield
block.alef-null-limit-shield.description = Creates an energy shield that tends to its maximum value.

block.alef-null-sum-wall.name = Sum wall
block.alef-null-sum-wall.description = Sum of ones. Ones fly apart when destroyed.

block.alef-null-small-sum-wall.name = Small sum wall
block.alef-null-small-sum-wall.description = Sum of ones. Ones fly apart when destroyed.

block.alef-null-inverted-wall.name = Inverting wall
block.alef-null-inverted-wall.description = Inverts enemy projectiles. Negative ones fly apart when destroyed.

block.alef-null-small-inverted-wall.name = Small inverting wall
block.alef-null-small-inverted-wall.description = Inverts enemy projectiles. Negative ones fly apart when destroyed.

block.alef-null-extrapolator.name = Extrapolator
block.alef-null-extrapolator.description = Extrapolates nearby blocks to their original state.

// ========== STATUSES ==========
status.alef-null-positive-energy.name = Addition energy
status.alef-null-positive-energy.description = Constantly adds health.

status.alef-null-negative-energy.name = Subtraction energy
status.alef-null-negative-energy.description = Constantly subtracts health.

status.alef-null-division-energy.name = Division energy
status.alef-null-division-energy.description = Splits health and speed in half.

status.alef-null-multiplication-energy.name = Multiplication energy
status.alef-null-multiplication-energy.description = Multiplies health and speed by 1.5.

status.alef-null-the-power-of-the-great-taiga.name = Power of the Great Taiga
status.alef-null-the-power-of-the-great-taiga.description = The power bestowed by the great taiga.

// ========== UNITS ==========
unit.alef-null-subitizator.name = Subitizator
unit.alef-null-subitizator.description = Work unit. Mines resources, heals allied buildings, and restores health of nearby allies. Embodiment of a mathematician.

unit.alef-null-additor.name = Additor
unit.alef-null-additor.description = Work unit. Mines pluses and heals buildings. Embodiment of addition.

unit.alef-null-multiplier.name = Multiplier
unit.alef-null-multiplier.description = Work unit. Mines pluses and heals buildings. Embodiment of multiplication.

unit.alef-null-subtractor.name = Subtractor
unit.alef-null-subtractor.description = Subtracts itself from the enemy, dying in the process. Embodiment of subtraction.

unit.alef-null-inverted-subtractor.name = Inverted subtractor
unit.alef-null-inverted-subtractor.description = Subtracts enemy damage from itself and its shield. Has no offensive abilities. Embodiment of inverse subtraction.

unit.alef-null-divider.name = Divider
unit.alef-null-divider.description = Divides enemy health in half and deals damage. Embodiment of division.

unit.alef-null-hyperbolic-divider.name = Hyperbolic divider
unit.alef-null-hyperbolic-divider.description = Divides enemy health in half and deals damage with splitting projectiles. Embodiment of fractions.

unit.alef-null-log.name = Logarithm
unit.alef-null-log.description = Log (not used in the campaign)

unit.alef-null-super-log.name = Superlogarithm
unit.alef-null-super-log.description = Slog (not used in the campaign)

unit.alef-null-inverter.name = Inverter

// ========== OTHER ==========
block.alef-null-pi-projector.name = Pi projector
block.alef-null-pi-projector.description = Creates a spherical circular round circle around itself, which protects from enemy projectiles.

// ========== PUNS (octopus + memes) ==========
unit.alef-null-pun.name = Pun
unit.alef-null-pun.description = An octopus that tells great jokes — it is an octo-moron.

unit.alef-null-pun-ai.name = Pun (auto-attack)

unit.alef-null-pun-missile.name = Pun (in flight)

block.alef-null-pun-turret.name = Octogun
block.alef-null-pun-turret.description = Shoots octopuses. (Octogun is a minigun but octopus)