// ========== PLANETS ==========
planet.alef-null-arithmetic.name = Arithmetic
planet.alef-null-arithmetic.description = A branch of mathematics that studies the simplest operations with numbers.

// ========== SECTORS ==========
sector.alef-null-subitization.name = Subitization
sector.alef-null-subitization.description = The first sector of the first set of numbers in the first branch of mathematics. Learn the basics of arithmetic and repel waves of negative operations.

// ========== CORES ==========
block.alef-null-core-n.name = Core: «Axiom»
block.alef-null-core-n.description = First iteration of the core. N denotes belonging to natural numbers.

// ========== ITEMS ==========
item.alef-null-one.name = Unit
item.alef-null-one.description = Unit – the basis of natural numbers.

item.alef-null-anti-one.name = Negative unit
item.alef-null-anti-one.description = Negative unit – the antipode of the unit and the basis of negative numbers.

item.alef-null-i.name = Imaginary unit
item.alef-null-i.description = Imaginary unit – the basis of complex numbers.

item.alef-null-zero.name = Zero
item.alef-null-zero.description = Emptiness – the basis of all sets.

item.alef-null-fraction.name = Fraction
item.alef-null-fraction.description = 1/x – the basis of rational numbers.

item.alef-null-variable.name = Variable
item.alef-null-variable.description = Variable – the basis of algebra, represents an unknown number.

item.alef-null-plus.name = Plus
item.alef-null-plus.description = Symbol of addition.

item.alef-null-minus.name = Minus
item.alef-null-minus.description = Symbol of subtraction.

item.alef-null-pi.name = π
item.alef-null-pi.description = Mathematical constant used in trigonometry.

// ========== DRILLS ==========
block.alef-null-successor.name = Successor
block.alef-null-successor.description = Mines pluses from deposits.

// ========== PRODUCTION ==========
block.alef-null-pluser.name = Pluser
block.alef-null-pluser.description = Turns plus into unit.

block.alef-null-minuser.name = Minuser
block.alef-null-minuser.description = Turns minus into negative unit.

block.alef-null-equalizer.name = Equalizer
block.alef-null-equalizer.description = Equalizes 1 and -1 into 0.

block.alef-null-absolute-value.name = Absolute value
block.alef-null-absolute-value.description = Converts any number into a positive one.

block.alef-null-mono-constructor.name = Mono-constructor
block.alef-null-mono-constructor.description = Produces the basic unit - the Additor.

// ========== TURRETS ==========
block.alef-null-exponential-progressor.name = Exponential progressor
block.alef-null-exponential-progressor.description = Basic turret based on powers of two. Each shot is 2 times stronger.

// ========== LOGISTICS ==========
block.alef-null-mono-conveyor.name = Mono-conveyor
block.alef-null-mono-conveyor.description = Basic conveyor based on the commutativity of addition.

block.alef-null-intersection.name = Intersection
block.alef-null-intersection.description = Allows two intersecting conveyors to work independently without mixing items.

block.alef-null-equals.name = Equals
block.alef-null-equals.description = Equalizes item counts between neighboring blocks.

block.alef-null-division.name = Division
block.alef-null-division.description = Divides one input stream into three output streams.

// ========== POWER ==========
block.alef-null-generator-decay.name = Decay generator
block.alef-null-generator-decay.description = Splits units into energy and zero.

block.alef-null-math-node.name = Graph vertex
block.alef-null-math-node.description = Transfers energy between blocks.

// ========== WALLS ==========
block.alef-null-limit-shield.name = Limit shield
block.alef-null-limit-shield.description = Creates an energy shield that tends to its maximum value.

block.alef-null-sum-wall.name = Sum
block.alef-null-sum-wall.description = Sum of natural numbers.

// ========== STATUSES ==========
status.alef-null-positive-energy.name = Addition energy
status.alef-null-positive-energy.description = Strengthens allies.

status.alef-null-negative-energy.name = Subtraction energy
status.alef-null-negative-energy.description = Weakens enemies.

status.alef-null-fission-energy.name = Division energy
status.alef-null-fission-energy.description = Splits enemy health in half.

// ========== UNITS ==========
unit.alef-null-subitizator.name = Subitizator
unit.alef-null-subitizator.description = Work unit. Mines resources, heals allied buildings, and restores health of nearby allies.

unit.alef-null-additor.name = Additor
unit.alef-null-additor.description = Work unit. Mines pluses and heals buildings.

unit.alef-null-subtractor.name = Subtractor
unit.alef-null-subtractor.description = Subtracts itself from the enemy, dying in the process.

unit.alef-null-divider.name = Divider
unit.alef-null-divider.description = Divides enemy health and deals damage.

unit.alef-null-log.name = Logarithm
unit.alef-null-log.description = Log

unit.alef-null-super-log.name = Superlogarithm
unit.alef-null-super-log.description = Slog