// ========== CORES ==========
block.alef-null-core-n.name = Ядро: «Аксиома»
block.alef-null-core-n.description = Первая итерация ядра.

// ========== ITEMS ==========
item.alef-null-one.name = Единица
item.alef-null-one.description = Базовый математический ресурс

item.alef-null-anti-one.name = Отрицательная единица
item.alef-null-anti-one.description = Отрицательный математический ресурс

item.alef-null-i.name = Мнимая единица
item.alef-null-i.description = Мнимый математический ресурс

item.alef-null-zero.name = Ноль
item.alef-null-zero.description = Математический вакуум

// ========== DRILLS ==========
block.alef-null-successor.name = Сукцессор
block.alef-null-successor.description = Добывает единицы из вкраплений. Потребляет вычислительную мощность.

// ========== TURRETS ==========
block.alef-null-exponential-progressor.name = Экспоненциальный прогрессор
block.alef-null-exponential-progressor.description = Базовая турель на основе Σ. Каждый выстрел в 2 раза больше предыдущего.

// ========== LOGISTICS ==========
block.alef-null-mono-conveyor.name = Моно-конвейер
block.alef-null-mono-conveyor.description = Базовый конвейер из единицы

block.alef-null-intersection.name = Пересечение множеств
block.alef-null-intersection.description = Позволяет двум пересекающимся конвейерам работать независимо, не смешивая предметы.

block.alef-null-equals.name = Равенство
block.alef-null-equals.description = Уравнивает количество предметов между соседними блоками.

block.alef-null-divider.name = Делитель
block.alef-null-divider.description = Делит один входной поток на три выходных.

// ========== POWER ==========
block.alef-null-generator-decay.name = Генератор распада материи
block.alef-null-generator-decay.description = Расщепляет единицы на энергию и жидкий ноль.

block.alef-null-math-node.name = Энергоузел
block.alef-null-math-node.description = Передаёт энергию между блоками.

// ========== WALLS ==========
block.alef-null-limit-shield.name = Лимит щита
block.alef-null-limit-shield.description = Создаёт энергетический щит, стремящийся к максимальному значению.

// ========== STATUSES ==========
status.alef-null-positive-energy.name = Положительная энергия
status.alef-null-positive-energy.description = Усиливает союзников.

status.alef-null-negative-energy.name = Отрицательная энергия
status.alef-null-negative-energy.description = Ослабляет врагов.

// ========== UNITS ==========
unit.alef-null-subitizator.name = Субитизатор
unit.alef-null-subitizator.description = Рабочий юнит. Добывает ресурсы, лечит союзные постройки и восстанавливает здоровье союзников рядом.

unit.alef-null-absorber.name = Абсорбер
unit.alef-null-absorber.description = Взрывается при смерти, нанося урон врагам.

unit.alef-null-disintegrator.name = Дезинтегратор
unit.alef-null-disintegrator.description = Средний юнит. Оснащён сдвоенными лазерами отрицательной энергии, стреляющими по очереди.