# ========== MOD ==========
mod.alef-null.name = [#80ff80]Алеф Нулл[]
mod.alef-null.author = [#80ff80]Кселирит[]
mod.alef-null.description = Этот мод должен добавлять планету с математикой в качестве блоков, но пока только 2 сектора\n[accent]Особое спасибо: чмоня, пунь.[]
mod.alef-null.subtitle = [#aaffaa]tapok[]

// ========== PLANETS ==========
planet.alef-null-01-math.name = Математика

planet.alef-null-02-arithmetic.name = Арифметика
planet.alef-null-02-arithmetic.description = Раздел математики, изучающий простейшие действия с числами.

// ========== SECTORS ==========
sector.alef-null-subitization.name = Субитизация
sector.alef-null-subitization.description = Первый сектор первого множества чисел первого раздела математики. Изучите азы арифметики и отбейте волны из отрицательных действий.

sector.alef-null-function-bridge.name = Мост между функциями
sector.alef-null-function-bridge.description = Сектор, который имеет форму функций сложения и вычитания. Отбейте усиленные волны врагов, изучите улучшенную турель и изучите технологию производства юнитов для обороны.

// ========== CORES ==========
block.alef-null-core-n.name = Ядро: «Аксиома»
block.alef-null-core-n.description = Первая итерация ядра. N обозначает принадлежность к натуральным числам.

// ========== ITEMS ==========
// == NUMBERS ==
item.alef-null-one.name = Единица
item.alef-null-one.description = Единица – основа натуральных чисел.
item.alef-null-one.details = Положительное натуральное нечётное число, мультипликативная нейтраль, аддитивная основа числового поля, которая располагается на числовой прямой в каждом множестве чисел (натуральные, целые, рациональные, действительные, комплексные и даже множество двоичного кода {0, 1}). Является наименьшим положительным элементом во множестве натуральных чисел. Алгебраически замкнута относительно самой себя без учёта действий первого порядка. Также является количеством моих нейронов при создании этого текста.

item.alef-null-anti-one.name = Отрицательная единица
item.alef-null-anti-one.description = Отрицательная единица – антипод единицы и основа отрицательных чисел.
item.alef-null-anti-one.details = Количество моих ай-кью при создании мода.

item.alef-null-zero.name = Ноль
item.alef-null-zero.description = Пустота – основа всех множеств.
item.alef-null-zero.details = Ноль - не положительное и не отрицательное число, входящее в основу всей математики, аддитивная нейтраль и то, что находилось у меня в голове при создании мода.

item.alef-null-i.name = Мнимая единица
item.alef-null-i.description = Мнимая единица – основа комплексных чисел.
item.alef-null-i.details = Корень из отрицательной единицы, поворот на 90 градусов, проход в числовую плоскость. iгорь!

item.alef-null-fraction.name = Дробь
item.alef-null-fraction.description = 1/x — основа рациональных чисел.
item.alef-null-fraction.details = Не от дробовика! (но это не точно)

// == CONSTANTS ==
item.alef-null-pi.name = Число пи
item.alef-null-pi.description = π - основа тригонометрии.
item.alef-null-pi.details = Половина окружности в радианах, поворот на 180 градусов. door?...

item.alef-null-e.name = Число Эйлера
item.alef-null-e.description = е - константа, которая много где встречается (автор слишком тупень и не знает где это конкретно используется)
item.alef-null-e.details = сложные проценты, сумма обратных факториалов и Alan Becker reference.

// == OPERATIONS ==
item.alef-null-plus.name = Плюс
item.alef-null-plus.description = Символ сложения. Повторная сукцессия. Действие первого порядка.
item.alef-null-plus.details = Коммутативно. Ассоциативно. Дистрибутивно относительно умножения. Но сукцессия лучше

item.alef-null-minus.name = Минус
item.alef-null-minus.description = Символ вычитания. Обратное действие сложению - забирание чего-то из чего-то. Действие первого порядка.
item.alef-null-minus.details = Обратное действие сложению - кража тапков из хранилища (чистое зло)

liquid.alef-null-inversion.name = Инверсия
liquid.alef-null-inversion.description = Базовое понятие обратности. Используется для инверсии единиц, действий и врагов.

item.alef-null-multiplication.name = Умножение
item.alef-null-multiplication.description = Повторяющееся сложение. Действие второго порядка.

liquid.alef-null-bijection.name = Биекция
liquid.alef-null-bijection.description = Понятие соответствия двух множеств и оппозиции. Необходима для построения числовой плоскости.

item.alef-null-division.name = Деление
item.alef-null-division.description = Обратное действие умножению - разделение целого на части. Действие второго порядка.
item.alef-null-division.details = он тот ещё инdividуум!

item.alef-null-power.name = Степень
item.alef-null-power.description = ^ - повторное умножение. Действие третьего порядка.

item.alef-null-root.name = Корень
item.alef-null-root.description = √ - обратное действие степени. Находит основание степени. Действие третьего порядка.
item.alef-null-root.details = Виктор Корнеплод и Корней Корнеевич в одном лице

item.alef-null-logarithm.name = Логарифм
item.alef-null-logarithm.description = log - обратное действие степени. Находит показатель степени. Действие третьего порядка.

item.alef-null-factorial.name = Факториал
item.alef-null-factorial.description = ! - произведение всех чисел от 1 до n.
item.alef-null-factorial.details = Кусок умножения и какой-то там прогрессии

// == OTHER ==
item.alef-null-variable.name = Переменная
item.alef-null-variable.description = Переменная - основа алгебры, обозначает неизвестное любое число.
item.alef-null-variable.details = "найдите x"

item.alef-null-approaches-infinity.name = Стремление к бесконечности
item.alef-null-approaches-infinity.description = Лютый тапок, который не число, не бесконечность, а предел функии которая идёт вверх.
item.alef-null-approaches-infinity.details = Бесконечность не пердел!

item.alef-null-lim.name = Предел
item.alef-null-lim.description = lim - предел функции или последовательности.
item.alef-null-lim.details = Ты куда пердел?

item.alef-null-derivative.name = Производная
item.alef-null-derivative.description = d/dx - скорость изменения функции.

item.alef-null-function.name = Функция
item.alef-null-function.description = Алгоритм зависимости y от x.

// ========== DRILLS ==========
block.alef-null-successor.name = Сукцессор
block.alef-null-successor.description = Выполняет сукцессию над поверхностью, на которой расположен.
block.alef-null-successor.details = Сюжет математики если бы не сукцессия

// ========== PRODUCTION ==========
block.alef-null-pluser.name = Плюсер
block.alef-null-pluser.description = Превращает плюс в единицу.
block.alef-null-pluser.details = Сукцессия подошла бы лучше, но я ленивость

block.alef-null-minuser.name = Минусер
block.alef-null-minuser.description = Превращает минус в отрицательную единицу.

block.alef-null-equalizer.name = Уравниватель
block.alef-null-equalizer.description = Уравнивает 1 и -1 в 0.

block.alef-null-absolute-value.name = Абсолютная величина
block.alef-null-absolute-value.description = Превращает отрицательное число в положительное.

block.alef-null-mono-constructor.name = Моно-конструктор
block.alef-null-mono-constructor.description = Производит базовую единицу - слогателя.
block.alef-null-mono-constructor.details = Опять же сукцессия подошла бы лучше для первого юнита, но кто-то слишком ленивый

block.alef-null-anti-constructor.name = Анти-конструктор
block.alef-null-anti-constructor.description = Инвертирует единицы из вспомогательных в боевые.

block.alef-null-recursive-constructor.name = Рекурсивный конструктор
block.alef-null-recursive-constructor.description = Увеличивает порядок входящих юнитов с помощью рекурсии.
block.alef-null-recursive-constructor.details = Слогатель из маршрутизатора - это плейсхолдер для совместимости модулей, не кушайте его.

// ========== TURRETS ==========
block.alef-null-exponential-progressor.name = [red](Бомж)[] Экспоненциальный прогрессор
block.alef-null-exponential-progressor.description = По идее должен стрелять с каждым разом в два раза больше (с ограничением), но не подходит в качестве начальной турели т.к. арифметика

block.alef-null-additive-turret.name = Аддитивная турель
block.alef-null-additive-turret.description = Стреляет двойками по врагам.
block.alef-null-additive-turret.details = 1 + 1 = 2, но для баланса будет 20 урона.

block.alef-null-double-additive-turret.name = Двойная аддитивная турель
block.alef-null-double-additive-turret.description = Стреляет четвёрками по врагам.
block.alef-null-double-additive-turret.details = Alan Becker reference

// ========== LOGISTICS ==========
block.alef-null-mono-conveyor.name = Моно-конвейер
block.alef-null-mono-conveyor.description = Базовый конвейер на основе коммутативности сложения.

block.alef-null-deka-conveyor.name = Дека-конвейер
block.alef-null-deka-conveyor.description = Разделяет а затем умножает предметы на 10 для компактной транспортировки. Всё ещё на основе коммутативности сложения, а также первом законе термодинамики.

block.alef-null-imaginary-bridge.name = Мнимый мост
block.alef-null-imaginary-bridge.description = Переносит предметы с помощью домножения на i.

block.alef-null-intersection.name = Пересечение
block.alef-null-intersection.description = Позволяет двум пересекающимся конвейерам работать независимо, не смешивая предметы.

block.alef-null-equals.name = Равно
block.alef-null-equals.description = Уравнивает количество предметов между соседними блоками.

block.alef-null-division-router.name = Деление
block.alef-null-division-router.description = Делит один входной поток на три выходных.
block.alef-null-division-router.details = к сожалению деление не делается из деления, так как я не мог лишить вас маршрутизатора - я не монстр

// ========== POWER ==========
block.alef-null-generator-decay.name = Генератор распада
block.alef-null-generator-decay.description = Расщепляет единицы на энергию и ноль.
block.alef-null-generator-decay.details = Самый костыльный костыль в множестве костылей с костыльной частью на джава скрипе, так как костыль

block.alef-null-math-node.name = Вершина энергетического графа
block.alef-null-math-node.description = Передаёт энергию между блоками.

// ========== WALLS ==========
block.alef-null-limit-shield.name = Щит лимита
block.alef-null-limit-shield.description = Создаёт энергетический щит, стремящийся к максимальному значению.

block.alef-null-sum-wall.name = Стена суммы
block.alef-null-sum-wall.description = Сумма единиц. Единицы разлетаются при разрушении.

block.alef-null-small-sum-wall.name = Маленькая стена суммы
block.alef-null-small-sum-wall.description = Сумма единиц. Единицы разлетаются при разрушении.

block.alef-null-inverted-wall.name = Инвертирующая стена
block.alef-null-inverted-wall.description = Инвертирует вражеские снаряды. Отрицательные единицы разлетаются при разрушении.

block.alef-null-small-inverted-wall.name = Маленькая инвертирующая стена
block.alef-null-small-inverted-wall.description = Инвертирует вражеские снаряды. Отрицательные единицы разлетаются при разрушении.

block.alef-null-extrapolator.name = Экстраполятор
block.alef-null-extrapolator.description = Экстраполирует ближайшие блоки до их первоначального состояния.

// ========== STATUSES ==========
status.alef-null-positive-energy.name = Энергия сложения
status.alef-null-positive-energy.description = Постоянно прибавляет здоровье.

status.alef-null-negative-energy.name = Энергия вычитания
status.alef-null-negative-energy.description = Постоянно вычитает здоровье.

status.alef-null-division-energy.name = Энергия деления
status.alef-null-division-energy.description = Делит здоровье и скорость пополам.

status.alef-null-multiplication-energy.name = Энергия умножения
status.alef-null-multiplication-energy.description = Умножает здоровье и скорость на 1.5.

status.alef-null-the-power-of-the-great-taiga.name = Сила тайги

// ========== UNITS ==========
unit.alef-null-subitizator.name = Субитизатор
unit.alef-null-subitizator.description = Рабочая единица. Добывает ресурсы, лечит союзные постройки и восстанавливает здоровье союзников рядом. Олицетворение математика.

unit.alef-null-additor.name = Слогатель
unit.alef-null-additor.description = Рабочая единица. Может копать и лечить постройки. Плох в атаке на врагов.

unit.alef-null-multiplier.name = Умножатель
unit.alef-null-multiplier.description = Рабочая единица. Может копать, лечить постройки и строить. Плох в атаке на врагов.

unit.alef-null-subtractor.name = Вычитатель
unit.alef-null-subtractor.description = Боевая единица. При атаке вычитает себя из врага, при этом умирая.

unit.alef-null-inverted-subtractor.name = Инвертированный вычитатель
unit.alef-null-inverted-subtractor.description = Боевая единица. Вычитает урон врага из себя и своего щита. Не имеет атакующих способностей.

unit.alef-null-divider.name = Делитель
unit.alef-null-divider.description = Боевая единица. Делит здоровье врага пополам и наносит урон.

unit.alef-null-hyperbolic-divider.name = Гиперболический делитель
unit.alef-null-hyperbolic-divider.description = Боевая единица. Разделяется на множество снарядов, при этом умирая.

unit.alef-null-inverter.name = Инвертор
unit.alef-null-recursor.name = Рекурсор

// ========== OTHER ==========
block.alef-null-pi-projector.name = Круговой проектор
block.alef-null-pi-projector.description = Создаёт в сферической форме вокруг себя круговую круглую окружность округлой формы, которая защищает от вражеских снарядов.

// ========== PUNS (octopus + memes) ==========
unit.alef-null-pun.name = Пунь
unit.alef-null-pun.description = Осьминог, который хорошо шутит это окто-морон!

unit.alef-null-pun-ai.name = Пунь (автоатака)

unit.alef-null-pun-missile.name = Пунь (в потоке)

block.alef-null-pun-turret.name = Осьмиган
block.alef-null-pun-turret.description = Стреляет осьминогами.
