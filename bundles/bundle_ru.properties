// ========== PLANETS ==========
planet.alef-null-arithmetic.name = Арифметика
planet.alef-null-arithmetic.description = Раздел математики, изучающий простейшие действия с числами.

// ========== SECTORS ==========
sector.alef-null-subitization.name = Субитизация
sector.alef-null-subitization.description = Первый сектор первого множества чисел первого раздела математики. Изучите азы арифметики и отбейте волны из отрицательных действий.

// ========== CORES ==========
block.alef-null-core-n.name = Ядро: «Аксиома»
block.alef-null-core-n.description = Первая итерация ядра. N обозначает пренадлежность к натуральным числам.

// ========== ITEMS ==========
item.alef-null-one.name = Единица
item.alef-null-one.description = Единица – основа натуральных чисел.
item.alef-null-one.details = Положительное натуральное число, мультипликативная нейтраль, аддитивная основа числового поля, которая располагается на числовой прямой. Является наименьшим положительным элементом во множестве натуральных чисел. Алгебраически замкнута относительно самой себя. Также является количеством моих нейронов при создании этого текста.

item.alef-null-anti-one.name = Отрицательная единица
item.alef-null-anti-one.description = Отрицательная единица – антипод единицы и основа отрицательных чисел.
item.alef-null-anti-one.details = Количество моих I-Q при создании мода.

item.alef-null-i.name = Мнимая единица
item.alef-null-i.description = Мнимая единица – основа комплексных чисел.
item.alef-null-i.details = Корень из отрицательной единицы, поворот на 90 градусов, проход в числовую плоскость.

item.alef-null-zero.name = Ноль
item.alef-null-zero.description = Пустота – основа всех множеств.
item.alef-null-zero.details = То, что находилось у меня в голове при создании мода.

item.alef-null-fraction.name = Дробь
item.alef-null-fraction.description = 1/x — основа рациональных чисел.
item.alef-null-fraction.details = Не от дробовика!

item.alef-null-variable.name = Переменная
item.alef-null-variable.description = Переменная – основа алгебры, обозначает неизвестное число.
item.alef-null-variable.details = Свободный аргумент.

item.alef-null-plus.name = Плюс
item.alef-null-plus.description = Символ сложения.

item.alef-null-minus.name = Минус
item.alef-null-minus.description = Символ вычитания.

item.alef-null-pi.name = π
item.alef-null-pi.description = Число пи - основа тригонометрии.
item.alef-null-pi.details = Половина окружности в радианах, поворот на 180 градусов.

// ========== DRILLS ==========
block.alef-null-successor.name = Сукцессор
block.alef-null-successor.description = Добывает плюсы из вкраплений.

// ========== PRODUCTION ==========
block.alef-null-pluser.name = Плюсер
block.alef-null-pluser.description = Превращает плюс в единицу.

block.alef-null-minuser.name = Минусер
block.alef-null-minuser.description = Превращает минус в отрицательную единицу.

block.alef-null-equalizer.name = Уравниватель
block.alef-null-equalizer.description = Уравнивает 1 и -1 в 0.

block.alef-null-absolute-value.name = Абсолютная величина
block.alef-null-absolute-value.description = Абсолютная величина превращает любое число в положительное.

block.alef-null-mono-constructor.name = Моно-конструктор
block.alef-null-mono-constructor.description = Производит базовую единицу - слогателя.

// ========== TURRETS ==========
block.alef-null-exponential-progressor.name = Экспоненциальный прогрессор
block.alef-null-exponential-progressor.description = Базовая турель на основе степеней двойки. Каждый выстрел в 2 раза больше предыдущего.

block.alef-null-additive-turret.name = Аддитивная турель
block.alef-null-additive-turret.description = Стреляет единицами.
block.alef-null-additive-turret.details = 1 + 1 = 2, но для баланса будет 20 урона.

block.alef-null-double-additive-turret.name = Двойная аддитивная турель
block.alef-null-double-additive-turret.description = Стреляет единицами.
block.alef-null-double-additive-turret.details = 2 + 2 = 4, но для баланса будет 40 урона. \n [accent[]]Алан Беккер[[]]

// ========== LOGISTICS ==========
block.alef-null-mono-conveyor.name = Моно-конвейер
block.alef-null-mono-conveyor.description = Базовый конвейер на основе коммутативности сложения.

block.alef-null-intersection.name = Пересечение
block.alef-null-intersection.description = Позволяет двум пересекающимся конвейерам работать независимо, не смешивая предметы.

block.alef-null-equals.name = Равно
block.alef-null-equals.description = Уравнивает количество предметов между соседними блоками.

block.alef-null-division.name = Деление
block.alef-null-division.description = Делит один входной поток на три выходных.

// ========== POWER ==========
block.alef-null-generator-decay.name = Генератор распада
block.alef-null-generator-decay.description = Расщепляет единицы на энергию и ноль.

block.alef-null-math-node.name = Вершина энергетического графа
block.alef-null-math-node.description = Передаёт энергию между блоками.

// ========== WALLS ==========
block.alef-null-limit-shield.name = Щит лимита
block.alef-null-limit-shield.description = Создаёт энергетический щит, стремящийся к максимальному значению.

block.alef-null-sum-wall.name = Сумма
block.alef-null-sum-wall.description = Сумма натуральных чисел.

// ========== STATUSES ==========
status.alef-null-positive-energy.name = Энергия сложения
status.alef-null-positive-energy.description = Усиливает союзников.

status.alef-null-negative-energy.name = Энергия вычитания
status.alef-null-negative-energy.description = Ослабляет врагов.

status.alef-null-fission-energy.name = Энергия деления
status.alef-null-fission-energy.description = Делит здоровье врага пополам.

// ========== UNITS ==========
unit.alef-null-subitizator.name = Субитизатор
unit.alef-null-subitizator.description = Рабочий юнит. Добывает ресурсы, лечит союзные постройки и восстанавливает здоровье союзников рядом.

unit.alef-null-additor.name = Слогатель
unit.alef-null-additor.description = Рабочий юнит. Добывает плюсы и лечит постройки.

unit.alef-null-subtractor.name = Вычитатель
unit.alef-null-subtractor.description = Вычитает себя из врага, при этом умирая.

unit.alef-null-divider.name = Делитель
unit.alef-null-divider.description = Делит здоровье врага и наносит урон.

unit.alef-null-log.name = Логарифм
unit.alef-null-log.description = Лог

unit.alef-null-super-log.name = Суперлогарифм
unit.alef-null-super-log.description = Слог

// ========== PUNS (octopus) ==========
unit.alef-null-pun.name = Пунь
unit.alef-null-pun.description = Осьминог, который хорошо шутит это окто-морон.

unit.alef-null-pun-ai.name = Пунь (автоатака)

unit.alef-null-pun-missile.name = Пунь (в полёте)

block.alef-null-pun-turret.name = Осьмиган
block.alef-null-pun-turret.description = Стреляет осьминогами. (Осьмиган это миниган, но осьминог)
